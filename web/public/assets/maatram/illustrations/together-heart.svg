<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="sunburstGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B817"/>
      <stop offset="60%" stop-color="#E5A800"/>
      <stop offset="100%" stop-color="#C99200"/>
    </linearGradient>
    <linearGradient id="handLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D5B8"/>
      <stop offset="100%" stop-color="#E2A782"/>
    </linearGradient>
    <linearGradient id="handRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8BA96"/>
      <stop offset="100%" stop-color="#CE8C62"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2421" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Golden Sunburst Backdrop -->
  <circle cx="200" cy="180" r="160" fill="url(#sunburstGlow)"/>

  <!-- Radiating Sun Rays -->
  <g stroke="#F5B817" stroke-width="2.5" stroke-linecap="round" opacity="0.45">
    <line x1="200" y1="50" x2="200" y2="75"/>
    <line x1="270" y1="70" x2="255" y2="90"/>
    <line x1="320" y1="120" x2="295" y2="135"/>
    <line x1="330" y1="180" x2="305" y2="180"/>
    <line x1="130" y1="70" x2="145" y2="90"/>
    <line x1="80" y1="120" x2="105" y2="135"/>
    <line x1="70" y1="180" x2="95" y2="180"/>
  </g>

  <!-- Left Cupping Hand -->
  <path d="M70 290 C90 260 120 230 160 215 C175 210 185 220 175 235 C155 260 125 285 105 315 C95 325 75 310 70 290 Z" fill="url(#handLeft)" filter="url(#softShadow)"/>
  <path d="M100 300 C125 270 155 250 185 240 C195 245 195 255 180 265 C150 285 125 310 110 330 Z" fill="#E2A782" opacity="0.6"/>

  <!-- Right Cupping Hand -->
  <path d="M330 290 C310 260 280 230 240 215 C225 210 215 220 225 235 C245 260 275 285 295 315 C305 325 325 310 330 290 Z" fill="url(#handRight)" filter="url(#softShadow)"/>
  <path d="M300 300 C275 270 245 250 215 240 C205 245 205 255 220 265 C250 285 275 310 290 330 Z" fill="#CE8C62" opacity="0.6"/>

  <!-- Glowing Golden Radiant Heart -->
  <g filter="url(#softShadow)">
    <path d="M200 135 C170 85 110 95 110 150 C110 195 160 225 200 255 C240 225 290 195 290 150 C290 95 230 85 200 135 Z" fill="url(#heartGrad)"/>
    <!-- Heart Specular Highlight -->
    <path d="M140 120 C125 135 125 155 130 170 C132 155 140 135 155 125 C165 118 150 112 140 120 Z" fill="#FFFFFF" opacity="0.6"/>
    <!-- Heart Inner Star Core -->
    <polygon points="200,140 205,155 220,155 208,165 212,180 200,170 188,180 192,165 180,155 195,155" fill="#FFFDF5" opacity="0.85"/>
  </g>


</svg>

