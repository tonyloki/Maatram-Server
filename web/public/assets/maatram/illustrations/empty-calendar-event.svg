<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="calGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FDE047" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="calTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B817"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>
    <linearGradient id="calPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9F7F2"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFECE6"/>
      <stop offset="100%" stop-color="#DCD6CB"/>
    </linearGradient>
    <filter id="deskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1F2421" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="200" cy="150" r="130" fill="url(#calGlow)"/>

  <!-- Calendar Stand / Base (Isometric perspective) -->
  <g filter="url(#deskShadow)">
    <polygon points="100,240 300,240 330,265 70,265" fill="url(#standGrad)"/>
    <polygon points="70,265 330,265 330,272 70,272" fill="#B8B0A2"/>

    <!-- Desk Calendar Backboard -->
    <rect x="110" y="70" width="180" height="175" rx="16" fill="#EDE8DF"/>

    <!-- Calendar Pages Block -->
    <rect x="115" y="75" width="170" height="165" rx="14" fill="url(#calPage)"/>

    <!-- Golden Top Binding Header -->
    <path d="M115 89 C115 81.268 121.268 75 129 75 L271 75 C278.732 75 285 81.268 285 89 L285 115 L115 115 Z" fill="url(#calTop)"/>

    <!-- Spiral / Ring Binders -->
    <g fill="#1F2421">
      <rect x="145" y="66" width="8" height="18" rx="4" fill="#374151"/>
      <rect x="147" y="68" width="4" height="14" rx="2" fill="#9CA3AF"/>
      <rect x="195" y="66" width="8" height="18" rx="4" fill="#374151"/>
      <rect x="197" y="68" width="4" height="14" rx="2" fill="#9CA3AF"/>
      <rect x="245" y="66" width="8" height="18" rx="4" fill="#374151"/>
      <rect x="247" y="68" width="4" height="14" rx="2" fill="#9CA3AF"/>
    </g>

    <!-- Calendar Month Text -->
    <text x="200" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1F2421" letter-spacing="1.5">
      MAATRAM
    </text>

    <!-- Center Emblem Sunburst Leaf / Opportunity Date -->
    <g transform="translate(165, 130)">
      <!-- Radiant yellow circle with star & sparkle -->
      <circle cx="35" cy="35" r="30" fill="#FFF8E7" stroke="#F5B817" stroke-width="2"/>
      <!-- Maatram Rising Sun Rays & Leaf Motif -->
      <path d="M35 15 C35 28 20 38 35 48 C50 38 35 28 35 15 Z" fill="#F5B817"/>
      <circle cx="35" cy="35" r="6" fill="#1F2421"/>
    </g>

    <!-- Subtle Date Dots / Days Grid -->
    <g fill="#D1D5DB">
      <circle cx="140" cy="205" r="4"/>
      <circle cx="160" cy="205" r="4"/>
      <circle cx="180" cy="205" r="4"/>
      <circle cx="200" cy="205" r="4" fill="#F5B817"/>
      <circle cx="220" cy="205" r="4"/>
      <circle cx="240" cy="205" r="4"/>
      <circle cx="260" cy="205" r="4"/>
    </g>
    <text x="200" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#946C00">
      NEW OPPORTUNITIES
    </text>
  </g>

  <!-- Floating Sparkles & Soft Leaves -->
  <g fill="#F5B817" opacity="0.75">
    <polygon points="85,110 88,118 96,121 88,124 85,132 82,124 74,121 82,118"/>
    <polygon points="315,90 317,95 322,97 317,99 315,104 313,99 308,97 313,95"/>
    <polygon points="325,180 327,185 332,187 327,189 325,194 323,189 318,187 323,185"/>
  </g>
</svg>

