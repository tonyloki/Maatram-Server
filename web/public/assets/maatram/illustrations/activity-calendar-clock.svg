<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Warm Ambient Radial Glow -->
    <radialGradient id="calGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#FDE047" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Header Gradient -->
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B817"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>

    <!-- Natural Soft Drop Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350F" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1F2421" flood-opacity="0.05"/>
    </filter>

    <!-- Clock Drop Shadow -->
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2421" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 1. Ambient Warm Glow Background -->
  <ellipse cx="190" cy="115" rx="140" ry="90" fill="url(#calGlow)"/>

  <!-- 2. Framing Botanical Leaves -->
  <!-- Left Leaves -->
  <g fill="#F5B817" opacity="0.6">
    <path d="M110 135 C95 115 90 95 98 85 C108 95 112 115 110 135 Z"/>
    <path d="M120 150 C100 145 92 135 95 125 C108 128 118 138 120 150 Z"/>
    <path d="M102 110 C90 100 88 90 95 82 C102 88 106 98 102 110 Z" opacity="0.75"/>
  </g>
  <!-- Right Leaves -->
  <g fill="#F5B817" opacity="0.5">
    <path d="M265 140 C280 125 285 105 278 95 C268 105 264 125 265 140 Z"/>
    <path d="M255 155 C275 150 282 140 280 130 C268 132 258 142 255 155 Z"/>
  </g>

  <!-- 3. Radiant Energy Sparks (Top Right of Calendar) -->
  <g stroke="#F5B817" stroke-width="3" stroke-linecap="round">
    <line x1="245" y1="42" x2="255" y2="34"/>
    <line x1="256" y1="52" x2="268" y2="48"/>
    <line x1="258" y1="64" x2="270" y2="67"/>
  </g>

  <!-- 4. Desk Calendar Binder (Centered) -->
  <g filter="url(#softShadow)">
    <!-- Calendar Base Shadow & Pages Bevel -->
    <rect x="135" y="47" width="110" height="114" rx="18" fill="#E5E7EB"/>
    <rect x="133" y="45" width="110" height="114" rx="18" fill="#F3F4F6"/>

    <!-- Main White Calendar Sheet -->
    <rect x="130" y="42" width="110" height="114" rx="18" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="1.5"/>

    <!-- Golden Top Binder Header Bar -->
    <path d="M130 58 C130 49.163 137.163 42 146 42 L224 42 C232.837 42 240 49.163 240 58 L240 68 L130 68 Z" fill="url(#calHeader)"/>

    <!-- Binder Metal Rings -->
    <rect x="156" y="36" width="6" height="14" rx="3" fill="#374151"/>
    <rect x="208" y="36" width="6" height="14" rx="3" fill="#374151"/>

    <!-- Calendar 3x3 Date Grid -->
    <g fill="#E5E7EB">
      <!-- Row 1 -->
      <rect x="146" y="78" width="18" height="14" rx="4"/>
      <rect x="176" y="78" width="18" height="14" rx="4"/>
      <rect x="206" y="78" width="18" height="14" rx="4"/>

      <!-- Row 2 -->
      <rect x="146" y="98" width="18" height="14" rx="4"/>
      <rect x="176" y="98" width="18" height="14" rx="4"/>
      <rect x="206" y="98" width="18" height="14" rx="4" fill="#FDE68A"/>

      <!-- Row 3 -->
      <rect x="146" y="118" width="18" height="14" rx="4"/>
      <rect x="176" y="118" width="18" height="14" rx="4"/>
      <rect x="206" y="118" width="18" height="14" rx="4"/>
    </g>
  </g>

  <!-- 5. Overlapping Analog Clock (Bottom Right) -->
  <g filter="url(#clockShadow)">
    <!-- White Clock Face with Bold Dark Border -->
    <circle cx="236" cy="142" r="32" fill="#FFFFFF" stroke="#1F2421" stroke-width="4.5"/>

    <!-- Clock Center Pin -->
    <circle cx="236" cy="142" r="3.5" fill="#1F2421"/>

    <!-- Clock Hour & Minute Hands (Pointing 10:10 for friendly aesthetic) -->
    <line x1="236" y1="142" x2="225" y2="128" stroke="#1F2421" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="236" y1="142" x2="252" y2="142" stroke="#1F2421" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Subtle 12-Hour Mark -->
    <line x1="236" y1="114" x2="236" y2="119" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>

