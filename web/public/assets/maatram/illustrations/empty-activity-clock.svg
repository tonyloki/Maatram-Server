<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="actGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FDE047" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B817"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>
    <filter id="objShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F2421" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="225" cy="160" r="150" fill="url(#actGlow)"/>

  <!-- Left: Desk Calendar -->
  <g filter="url(#objShadow)" transform="translate(40, 20)">
    <!-- Base -->
    <polygon points="50,230 210,230 230,250 30,250" fill="#E5E0D8"/>
    <!-- Page Block -->
    <rect x="50" y="70" width="150" height="155" rx="14" fill="#FFFFFF"/>
    <!-- Gold Header -->
    <path d="M50 84 C50 76.268 56.268 70 64 70 L186 70 C193.732 70 200 76.268 200 84 L200 105 L50 105 Z" fill="url(#goldGradient)"/>
    <!-- Rings -->
    <rect x="75" y="62" width="6" height="16" rx="3" fill="#374151"/>
    <rect x="122" y="62" width="6" height="16" rx="3" fill="#374151"/>
    <rect x="168" y="62" width="6" height="16" rx="3" fill="#374151"/>
    <!-- Text -->
    <text x="125" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1F2421" letter-spacing="1">
      ACTIVITIES
    </text>
    <!-- Big Checkmark & Date -->
    <circle cx="125" cy="155" r="32" fill="#FFF8E7" stroke="#F5B817" stroke-width="2"/>
    <path d="M112 155 L121 164 L138 147" stroke="#F5B817" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#6B7280">
      0 REGISTERED
    </text>
  </g>

  <!-- Right: Floating Analogue Clock -->
  <g filter="url(#objShadow)" transform="translate(240, 60)">
    <!-- Clock Outer Rim -->
    <circle cx="90" cy="90" r="75" fill="#FFFFFF" stroke="#EFECE6" stroke-width="4"/>
    <!-- Clock Gold Ring -->
    <circle cx="90" cy="90" r="67" fill="#FAF8F5" stroke="#F5B817" stroke-width="2.5"/>
    <!-- Clock Hour Marks -->
    <line x1="90" y1="30" x2="90" y2="38" stroke="#1F2421" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="142" x2="90" y2="150" stroke="#1F2421" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="90" x2="38" y2="90" stroke="#1F2421" stroke-width="3" stroke-linecap="round"/>
    <line x1="142" y1="90" x2="150" y2="90" stroke="#1F2421" stroke-width="3" stroke-linecap="round"/>
    <!-- Clock Hands (Pointing to 10:10 for friendly energy) -->
    <line x1="90" y1="90" x2="68" y2="60" stroke="#1F2421" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="90" y1="90" x2="120" y2="65" stroke="#F5B817" stroke-width="3" stroke-linecap="round"/>
    <!-- Center Pin -->
    <circle cx="90" cy="90" r="5" fill="#1F2421"/>
    <circle cx="90" cy="90" r="2" fill="#F5B817"/>
    <!-- Hours badge -->
    <rect x="58" y="112" width="64" height="18" rx="9" fill="#DEF7EC"/>
    <text x="90" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#03543F">
      0.0 HRS
    </text>
  </g>

  <!-- Framing Botanical Leaves -->
  <g fill="#F5B817" opacity="0.65">
    <!-- Branch Left -->
    <path d="M40 270 Q60 230 70 200 Q75 220 60 250 Z"/>
    <path d="M50 250 Q75 240 85 225 Q80 245 65 260 Z"/>
    <!-- Branch Right -->
    <path d="M410 270 Q390 230 380 200 Q375 220 390 250 Z"/>
    <path d="M400 250 Q375 240 365 225 Q370 245 385 260 Z"/>
  </g>

  <!-- Golden Stars & Sparkles -->
  <g fill="#F5B817">
    <polygon points="230,40 233,48 241,51 233,54 230,62 227,54 219,51 227,48"/>
    <polygon points="50,90 52,95 57,97 52,99 50,104 48,99 43,97 48,95"/>
    <polygon points="390,70 392,75 397,77 392,79 390,84 388,79 383,77 388,75"/>
  </g>
</svg>

