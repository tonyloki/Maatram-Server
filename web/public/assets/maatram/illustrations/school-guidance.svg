<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="schoolGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FDE047" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B817"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="schoolShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F2421" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="200" r="170" fill="url(#schoolGlow)"/>

  <!-- Schoolhouse Building Vector -->
  <g filter="url(#schoolShadow)" transform="translate(130, 100)">
    <!-- Base/Walls -->
    <rect x="30" y="80" width="180" height="150" rx="8" fill="#FFFFFF" stroke="#EFECE6" stroke-width="2"/>
    <!-- Triangular Pediment / Roof -->
    <polygon points="120,20 225,80 15,80" fill="url(#roofGrad)"/>
    <polygon points="120,28 210,80 30,80" fill="#FBBF24" opacity="0.3"/>
    <!-- School Clock / Bell in Gable -->
    <circle cx="120" cy="55" r="14" fill="#FFFFFF" stroke="#1F2421" stroke-width="2"/>
    <line x1="120" y1="55" x2="120" y2="47" stroke="#1F2421" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="55" x2="126" y2="55" stroke="#F5B817" stroke-width="2" stroke-linecap="round"/>
    <!-- Main Entrance Door -->
    <rect x="100" y="160" width="40" height="70" rx="6" fill="#1F2421"/>
    <circle cx="132" cy="195" r="2.5" fill="#F5B817"/>
    <!-- Windows (Classrooms) -->
    <rect x="50" y="110" width="34" height="40" rx="4" fill="#FFF8E7" stroke="#F5B817" stroke-width="2"/>
    <line x1="67" y1="110" x2="67" y2="150" stroke="#F5B817" stroke-width="1.5"/>
    <line x1="50" y1="130" x2="84" y2="130" stroke="#F5B817" stroke-width="1.5"/>

    <rect x="156" y="110" width="34" height="40" rx="4" fill="#FFF8E7" stroke="#F5B817" stroke-width="2"/>
    <line x1="173" y1="110" x2="173" y2="150" stroke="#F5B817" stroke-width="1.5"/>
    <line x1="156" y1="130" x2="190" y2="130" stroke="#F5B817" stroke-width="1.5"/>

    <!-- School Flagpole with Fluttering Maatram Banner -->
    <line x1="120" y1="20" x2="120" y2="-10" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 -8 C135 -14 140 -2 155 -8 L155 8 C140 14 135 2 120 8 Z" fill="#F5B817"/>
  </g>

  <!-- Green Grass Mound Base -->
  <path d="M50 330 Q250 280 450 330 L450 370 L50 370 Z" fill="#86EFAC" opacity="0.6"/>

  <!-- Left: Tree -->
  <g transform="translate(60, 180)">
    <rect x="35" y="90" width="10" height="40" rx="2" fill="#78350F"/>
    <circle cx="40" cy="80" r="35" fill="#16A34A"/>
    <circle cx="28" cy="65" r="25" fill="#22C55E"/>
    <circle cx="52" cy="65" r="25" fill="#15803D"/>
  </g>

  <!-- Right: Signpost "Govt High School" -->
  <g transform="translate(370, 230)">
    <rect x="22" y="30" width="6" height="70" rx="2" fill="#6B7280"/>
    <rect x="0" y="20" width="80" height="28" rx="6" fill="#1F2421"/>
    <text x="40" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F5B817">
      GOVT SCHOOL
    </text>
  </g>
</svg>

