<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="sunCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B817" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#FDE047" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#FEF08A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Central Radial Core -->
  <circle cx="200" cy="200" r="190" fill="url(#sunCenter)"/>

  <!-- Rotating Triangular Sunburst Beams -->
  <g fill="#F5B817" opacity="0.18">
    <!-- 16 Ray Pairs around 360 degrees -->
    <polygon points="200,200 190,0 210,0"/>
    <polygon points="200,200 265,10 282,23"/>
    <polygon points="200,200 335,55 350,72"/>
    <polygon points="200,200 385,122 395,142"/>
    <polygon points="200,200 400,190 400,210"/>
    <polygon points="200,200 395,258 385,278"/>
    <polygon points="200,200 350,328 335,345"/>
    <polygon points="200,200 282,377 265,390"/>
    <polygon points="200,200 210,400 190,400"/>
    <polygon points="200,200 135,390 118,377"/>
    <polygon points="200,200 65,345 50,328"/>
    <polygon points="200,200 15,278 5,258"/>
    <polygon points="200,200 0,210 0,190"/>
    <polygon points="200,200 5,142 15,122"/>
    <polygon points="200,200 50,72 65,55"/>
    <polygon points="200,200 118,23 135,10"/>
  </g>

  <!-- Inner Soft Golden Core -->
  <circle cx="200" cy="200" r="50" fill="#FFFDF5" opacity="0.7"/>
  <circle cx="200" cy="200" r="25" fill="#F5B817" opacity="0.8"/>
</svg>

