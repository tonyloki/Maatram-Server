<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 240" width="100%" height="100%" fill="none">
  <!-- Delicate botanical wheat stalks and leaves watermark -->
  <g fill="#F5B817" opacity="0.8">
    <!-- Center Stalk -->
    <path d="M58 240 C58 180 60 120 60 40" stroke="#F5B817" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Wheat Grains (Alternating left and right) -->
    <!-- Top Terminal Grain -->
    <path d="M60 40 C55 30 65 30 60 20 C55 30 65 30 60 40 Z"/>
    
    <!-- Grain Pair 1 -->
    <path d="M60 55 C48 45 42 60 58 65 Z"/>
    <path d="M60 62 C72 52 78 67 62 72 Z"/>
    
    <!-- Grain Pair 2 -->
    <path d="M60 75 C48 65 42 80 58 85 Z"/>
    <path d="M60 82 C72 72 78 87 62 92 Z"/>
    
    <!-- Grain Pair 3 -->
    <path d="M60 95 C48 85 42 100 58 105 Z"/>
    <path d="M60 102 C72 92 78 107 62 112 Z"/>
    
    <!-- Grain Pair 4 -->
    <path d="M60 115 C48 105 42 120 58 125 Z"/>
    <path d="M60 122 C72 112 78 127 62 132 Z"/>

    <!-- Arching Leaves from Base -->
    <!-- Left Leaf -->
    <path d="M58 190 Q20 180 10 140 Q35 155 58 175 Z"/>
    <!-- Right Leaf -->
    <path d="M60 170 Q100 160 110 120 Q85 135 60 155 Z"/>
    <!-- Lower Left Leaf -->
    <path d="M58 215 Q15 210 5 180 Q28 195 58 205 Z"/>
  </g>
</svg>

