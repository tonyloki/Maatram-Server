<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Warm Golden Ambient Radial Glow -->
    <radialGradient id="leadGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FDE047" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="leadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F5B817"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Silhouette Amber Gradient -->
    <linearGradient id="crowdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5B817" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F5B817" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="leadShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <ellipse cx="440" cy="90" rx="180" ry="85" fill="url(#leadGlow)"/>

  <!-- 1. Cheering Crowd Silhouettes (Volunteers with raised arms celebrating) -->
  <g fill="url(#crowdGrad)">
    <!-- Person 1 (Far Left) -->
    <circle cx="210" cy="95" r="16"/>
    <path d="M190 180 L195 125 Q210 115 225 125 L230 180 Z"/>
    <path d="M198 125 Q185 100 175 75 Q182 72 195 95 Q205 115 202 125 Z"/>

    <!-- Person 2 (Left Mid - Both arms raised) -->
    <circle cx="270" cy="85" r="18"/>
    <path d="M245 180 L252 118 Q270 108 288 118 L295 180 Z"/>
    <path d="M255 118 Q240 90 230 65 Q238 60 252 85 Q262 108 258 118 Z"/>
    <path d="M285 118 Q300 90 310 65 Q302 60 288 85 Q278 108 282 118 Z"/>

    <!-- Person 3 (Right Mid - Joyful celebration) -->
    <circle cx="350" cy="90" r="17"/>
    <path d="M325 180 L332 122 Q350 112 368 122 L375 180 Z"/>
    <path d="M365 122 Q380 95 390 70 Q382 65 368 90 Q358 112 362 122 Z"/>

    <!-- Person 4 (Right of Trophy) -->
    <circle cx="530" cy="88" r="18"/>
    <path d="M505 180 L512 120 Q530 110 548 120 L555 180 Z"/>
    <path d="M515 120 Q500 95 490 70 Q498 65 512 90 Q522 112 518 120 Z"/>
    <path d="M545 120 Q560 95 570 70 Q562 65 548 90 Q538 112 542 120 Z"/>

    <!-- Person 5 (Far Right) -->
    <circle cx="600" cy="95" r="16"/>
    <path d="M580 180 L585 125 Q600 115 615 125 L620 180 Z"/>
    <path d="M588 125 Q575 100 565 75 Q572 72 585 95 Q595 115 592 125 Z"/>
  </g>

  <!-- 2. Grand Champion Golden Trophy (Centered in Hero Composition) -->
  <g filter="url(#leadShadow)" transform="translate(400, 20)">
    <!-- Trophy Base Pedestal -->
    <rect x="25" y="118" width="50" height="12" rx="4" fill="#B45309"/>
    <rect x="20" y="130" width="60" height="16" rx="5" fill="#78350F"/>
    <rect x="23" y="132" width="54" height="4" rx="2" fill="#F5B817" opacity="0.6"/>

    <!-- Trophy Stem -->
    <path d="M42 98 L58 98 L54 118 L46 118 Z" fill="url(#leadGold)"/>

    <!-- Trophy Cup Main Body -->
    <path d="M22 28 C22 68 35 98 50 98 C65 98 78 68 78 28 Z" fill="url(#leadGold)"/>
    <ellipse cx="50" cy="28" rx="28" ry="8" fill="#FDE68A"/>

    <!-- Trophy Handles -->
    <path d="M22 36 C5 36 2 72 32 76 L30 68 C14 65 14 43 23 43 Z" fill="url(#leadGold)"/>
    <path d="M78 36 C95 36 98 72 68 76 L70 68 C86 65 86 43 77 43 Z" fill="url(#leadGold)"/>

    <!-- Champion Star on Trophy Body -->
    <polygon points="50,45 53,53 62,54 55,60 57,69 50,64 43,69 45,60 38,54 47,53" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- 3. Celebratory Golden Sparkles & Confetti Stars -->
  <g fill="#F5B817">
    <!-- Big Star Top Right -->
    <polygon points="510,25 513,31 520,33 514,37 516,44 510,40 504,44 506,37 500,33 507,31"/>
    <!-- Small Sparks -->
    <circle cx="360" cy="40" r="3.5"/>
    <circle cx="480" cy="18" r="2.5"/>
    <circle cx="560" cy="42" r="3"/>
    <circle cx="320" cy="30" r="2"/>
    <circle cx="530" cy="58" r="2"/>
  </g>
</svg>

