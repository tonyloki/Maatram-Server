<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="podiumBronzeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="50%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="podiumBronzeFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="podiumBronzeSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="bronzeShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F2421" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Bronze Crown #3 Floating on Top -->
  <g transform="translate(75, 12)">
    <path d="M5 35 L12 15 L30 25 L45 10 L60 25 L78 15 L85 35 Z" fill="url(#podiumBronzeTop)" stroke="#9A3412" stroke-width="1.5"/>
    <rect x="5" y="35" width="80" height="10" rx="3" fill="#FDBA74" stroke="#9A3412" stroke-width="1.5"/>
    <!-- Amber Jewels -->
    <circle cx="12" cy="15" r="3" fill="#D97706"/>
    <circle cx="45" cy="10" r="4" fill="#D97706"/>
    <circle cx="78" cy="15" r="3" fill="#D97706"/>
  </g>

  <!-- Physical 3D Pedestal Body (Right 3rd Place - Lowest) -->
  <g filter="url(#bronzeShadow)" transform="translate(20, 65)">
    <!-- Top Face -->
    <polygon points="90,0 180,26 90,52 0,26" fill="url(#podiumBronzeTop)"/>
    <polygon points="90,3 174,26 90,49 6,26" fill="#FFF7ED" opacity="0.6"/>

    <!-- Left/Front Face -->
    <polygon points="0,26 90,52 90,145 0,119" fill="url(#podiumBronzeFront)"/>
    
    <!-- Right Face -->
    <polygon points="90,52 180,26 180,119 90,145" fill="url(#podiumBronzeSide)"/>

    <!-- Rank "3" Embossment -->
    <g transform="translate(32, 55)">
      <circle cx="18" cy="22" r="23" fill="#FFF7ED" opacity="0.95"/>
      <circle cx="18" cy="22" r="19" fill="#FFEDD5"/>
      <text x="18" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#9A3412">
        3
      </text>
    </g>
  </g>
</svg>

