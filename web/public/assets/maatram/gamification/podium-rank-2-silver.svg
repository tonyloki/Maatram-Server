<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 270" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="podiumSilverTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="podiumSilverFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="podiumSilverSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="silverShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F2421" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Silver Crown #2 Floating on Top -->
  <g transform="translate(75, 15)">
    <path d="M5 35 L12 15 L30 25 L45 10 L60 25 L78 15 L85 35 Z" fill="url(#podiumSilverTop)" stroke="#64748B" stroke-width="1.5"/>
    <rect x="5" y="35" width="80" height="10" rx="3" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
    <!-- Sapphires -->
    <circle cx="12" cy="15" r="3" fill="#3B82F6"/>
    <circle cx="45" cy="10" r="4" fill="#3B82F6"/>
    <circle cx="78" cy="15" r="3" fill="#3B82F6"/>
  </g>

  <!-- Physical 3D Pedestal Body (Left 2nd Place - Mid-Height) -->
  <g filter="url(#silverShadow)" transform="translate(20, 70)">
    <!-- Top Face -->
    <polygon points="90,0 180,26 90,52 0,26" fill="url(#podiumSilverTop)"/>
    <polygon points="90,3 174,26 90,49 6,26" fill="#FFFFFF" opacity="0.7"/>

    <!-- Left/Front Face -->
    <polygon points="0,26 90,52 90,175 0,149" fill="url(#podiumSilverFront)"/>
    
    <!-- Right Face -->
    <polygon points="90,52 180,26 180,149 90,175" fill="url(#podiumSilverSide)"/>

    <!-- Rank "2" Embossment -->
    <g transform="translate(32, 68)">
      <circle cx="18" cy="22" r="23" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="18" cy="22" r="19" fill="#E2E8F0"/>
      <text x="18" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#334155">
        2
      </text>
    </g>
  </g>
</svg>

