<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F5B817"/>
    </radialGradient>
    <filter id="starShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1F2421" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Hanging Ribbons (Royal Blue & Gold) -->
  <polygon points="50,45 42,95 58,85 70,95 62,45" fill="#3B82F6"/>
  <polygon points="78,45 70,95 82,85 98,95 90,45" fill="#1D4ED8"/>

  <!-- Radiant Multi-Point Star Medallion -->
  <g filter="url(#starShadow)">
    <circle cx="70" cy="55" r="42" fill="url(#starGlow)" stroke="#B45309" stroke-width="2"/>
    <circle cx="70" cy="55" r="35" fill="#1F2421"/>
    
    <!-- Gleaming Golden Star -->
    <polygon points="70,28 75,44 92,44 78,54 83,70 70,60 57,70 62,54 48,44 65,44" fill="#F5B817"/>
    <polygon points="70,28 70,60 57,70 62,54 48,44 65,44 75,44" fill="#E5A800"/>
    <circle cx="70" cy="52" r="5" fill="#FFFDF5"/>
  </g>

  <!-- Title Pill Banner -->
  <rect x="20" y="105" width="100" height="22" rx="11" fill="#1F2421" stroke="#F5B817" stroke-width="1.5"/>
  <text x="70" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#F5B817" letter-spacing="0.5">
    STAR MENTOR
  </text>
</svg>

