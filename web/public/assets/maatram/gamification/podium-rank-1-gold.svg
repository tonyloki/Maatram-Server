<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="podiumGoldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F5B817"/>
    </linearGradient>
    <linearGradient id="podiumGoldFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5B817"/>
      <stop offset="50%" stop-color="#E5A800"/>
      <stop offset="100%" stop-color="#C99200"/>
    </linearGradient>
    <linearGradient id="podiumGoldSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B47800"/>
      <stop offset="100%" stop-color="#8C5C00"/>
    </linearGradient>
    <filter id="podiumShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1F2421" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Crown #1 Floating on Top -->
  <g transform="translate(85, 20)">
    <!-- 5-Point Crown -->
    <path d="M5 40 L15 15 L35 28 L55 8 L75 28 L95 15 L105 40 Z" fill="url(#podiumGoldTop)" stroke="#946C00" stroke-width="1.5"/>
    <rect x="5" y="40" width="100" height="12" rx="4" fill="#E5A800" stroke="#946C00" stroke-width="1.5"/>
    <!-- Jewels -->
    <circle cx="15" cy="15" r="3.5" fill="#EF4444"/>
    <circle cx="55" cy="8" r="4.5" fill="#EF4444"/>
    <circle cx="95" cy="15" r="3.5" fill="#EF4444"/>
    <!-- Crown Band Jewels -->
    <circle cx="25" cy="46" r="2.5" fill="#FFFFFF"/>
    <circle cx="45" cy="46" r="2.5" fill="#3B82F6"/>
    <circle cx="65" cy="46" r="2.5" fill="#FFFFFF"/>
    <circle cx="85" cy="46" r="2.5" fill="#3B82F6"/>
  </g>

  <!-- Physical 3D Pedestal Body (Center 1st Place - Tallest) -->
  <g filter="url(#podiumShadow)" transform="translate(20, 85)">
    <!-- Top Face (Isometric surface where avatar rests) -->
    <polygon points="100,0 200,30 100,60 0,30" fill="url(#podiumGoldTop)"/>
    <!-- Top Face Rim Highlight -->
    <polygon points="100,3 194,30 100,57 6,30" fill="#FFFDF5" opacity="0.6"/>

    <!-- Left/Front Face -->
    <polygon points="0,30 100,60 100,210 0,180" fill="url(#podiumGoldFront)"/>
    
    <!-- Right Face -->
    <polygon points="100,60 200,30 200,180 100,210" fill="url(#podiumGoldSide)"/>

    <!-- Roman Numeral "I" / Rank "1" Embossment on Front Face -->
    <g transform="translate(38, 90)">
      <circle cx="20" cy="25" r="26" fill="#FFFDF5" opacity="0.95"/>
      <circle cx="20" cy="25" r="22" fill="#F5B817"/>
      <text x="20" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#1F2421">
        1
      </text>
    </g>

    <!-- Laurel Wreath Flanking Center -->
    <g stroke="#FFF8E7" stroke-width="2" fill="#FFF8E7">
      <!-- Left Laurel Leaves -->
      <path d="M42 105 C35 95 32 80 40 70" fill="none"/>
      <ellipse cx="34" cy="98" rx="4" ry="2" transform="rotate(-30 34 98)"/>
      <ellipse cx="32" cy="85" rx="4" ry="2" transform="rotate(-15 32 85)"/>
      <ellipse cx="38" cy="74" rx="4" ry="2" transform="rotate(10 38 74)"/>
      <!-- Right Laurel Leaves -->
      <path d="M78 105 C85 95 88 80 80 70" fill="none"/>
      <ellipse cx="86" cy="98" rx="4" ry="2" transform="rotate(30 86 98)"/>
      <ellipse cx="88" cy="85" rx="4" ry="2" transform="rotate(15 88 85)"/>
      <ellipse cx="82" cy="74" rx="4" ry="2" transform="rotate(-10 82 74)"/>
    </g>
  </g>
</svg>

