<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="superGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F5B817"/>
    </radialGradient>
    <filter id="superShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1F2421" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Hanging Ribbons (Crimson Red & Gold) -->
  <polygon points="50,45 42,95 58,85 70,95 62,45" fill="#EF4444"/>
  <polygon points="78,45 70,95 82,85 98,95 90,45" fill="#B91C1C"/>

  <!-- Winged Crown Medallion -->
  <g filter="url(#superShadow)">
    <circle cx="70" cy="55" r="42" fill="url(#superGlow)" stroke="#B45309" stroke-width="2"/>
    <circle cx="70" cy="55" r="35" fill="#1F2421"/>

    <!-- Golden Winged Crown Motif -->
    <!-- Wing Left -->
    <path d="M70 60 C55 45 42 50 40 40 C48 38 56 45 68 54 Z" fill="#F5B817"/>
    <!-- Wing Right -->
    <path d="M70 60 C85 45 98 50 100 40 C92 38 84 45 72 54 Z" fill="#E5A800"/>
    
    <!-- Crown Center -->
    <path d="M56 62 L60 48 L66 54 L70 42 L74 54 L80 48 L84 62 Z" fill="#FFFDF5" stroke="#F5B817" stroke-width="1.5"/>
    <circle cx="70" cy="42" r="2.5" fill="#EF4444"/>
  </g>

  <!-- Title Pill Banner -->
  <rect x="14" y="105" width="112" height="22" rx="11" fill="#1F2421" stroke="#F5B817" stroke-width="1.5"/>
  <text x="70" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#F5B817" letter-spacing="0.5">
    SUPER VOLUNTEER
  </text>
</svg>

