name: maatram_mobile
description: "Maatram Volunteering & Gamification Portal - Native Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  flutter_riverpod: ^2.5.1
  meta: ^1.11.0
  go_router: ^18.1.4
  cached_network_image: ^4.0.3
  intl: ^0.20.2
  flutter_svg: ^2.4.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/illustrations/
    - assets/decorations/
